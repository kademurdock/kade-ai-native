name: Arcade internal TestFlight upload (not wired yet)

# ============================================================================
# INERT ON PURPOSE (Oct 18 2026). This workflow never signs, builds or uploads
# anything yet. Its one job stops at once with the list below. It exists so the
# Arcade's release lane has a reviewed home, separate from the production
# upload, before anyone wires it.
#
# What the Arcade build needs (plan section 3C, item 21):
#   1. Build the app with the Arcade compiled in:
#        SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) KADE_ARCADE'
#      ($(inherited) keeps DEBUG/KADE_APP_TARGET per target; never list
#      KADE_APP_TARGET here, or the widget and keyboard extensions get it.)
#   2. Export for TestFlight internal testing only: ExportOptions with
#        method = app-store-connect, testFlightInternalTestingOnly = true
#      so the build can never reach external testers or App Review.
#   3. Upload with the existing approved family signing material and App Store
#      Connect key, after Kade says yes for that build.
#
# Why it is not mirrored from puppet-production-upload.yml yet:
#   - dev/puppet-production-upload.py builds through `xcode-project build-ipa`
#     with a FIXED argument list (no compilation conditions, app-store export
#     without testFlightInternalTestingOnly), and its `gate` step requires the
#     native host proof and the unsigned device proof of the exact commit.
#     Those proofs build the app WITHOUT KADE_ARCADE, so they do not prove the
#     Arcade binary. Reusing the script as-is would upload a build without the
#     Arcade, or need its proof contract changed.
#   - An Arcade lane therefore needs either a new, reviewed subcommand in that
#     script (its own proof: claude-native-check.yml's flagged compile on the
#     same commit) or a separate small script. Check first that no proof or
#     audit pins the script's bytes before editing it.
#   - TestFlight auto-update trap: an internal Arcade build and a regular build
#     share one app record. Pair the build numbers or keep the tester groups
#     separate, so a routine build never replaces her Arcade build.
#   - What to Test stays her one fixed line.
#   - No secret is referenced here until the lane is real.
# ============================================================================

'on':
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact commit to build with the Arcade flag (40 lowercase hex characters)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: arcade-internal-upload
  cancel-in-progress: false

jobs:
  not-wired-yet:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'kademurdock/kade-ai-native' &&
      github.actor == 'kademurdock'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop, the Arcade upload lane is not wired yet
        run: |
          echo "The Arcade internal upload lane is not wired yet."
          echo "Read the comment at the top of .github/workflows/arcade-internal-upload.yml for what it still needs."
          echo "Nothing was built, signed or uploaded."
          exit 1
