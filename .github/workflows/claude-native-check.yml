name: Native compile, model tests and puppet gallery

# RED ON PURPOSE (Nov 10 2026): this throwaway branch holds the T23 speech
# tests WITHOUT the SpeechStreamer change they guard, to watch them fail.
# Only the speech tests run here. Never merge this branch.
'on':
  push:
    branches: ['claude/native-**']

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'kademurdock/kade-ai-native' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false

      - name: Speech tests, expected to fail on T23
        timeout-minutes: 10
        run: |
          set -uo pipefail
          bash run-speech-tests.sh 2>&1 | tail -n 60
