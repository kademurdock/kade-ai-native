name: Native compile, model tests and puppet gallery

# Fast feedback for work-in-progress branches (claude/native-*). Never signs,
# archives, uploads or touches the release proof branches.
'on':
  push:
    branches: ['claude/native-**']

permissions:
  contents: read

concurrency:
  group: claude-native-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: github.repository == 'kademurdock/kade-ai-native' && github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          persist-credentials: false

      - name: Character, speech and puppet model tests
        id: models
        continue-on-error: true
        timeout-minutes: 12
        run: |
          set -euo pipefail
          bash run-character-tests.sh 2>&1 | tail -n 80
          bash run-speech-tests.sh 2>&1 | tail -n 40
          bash run-narration-voice-tests.sh 2>&1 | tail -n 20
          if [ -f run-puppet-tests.sh ]; then bash run-puppet-tests.sh 2>&1 | tail -n 120; fi
          if [ -f run-living-painting-tests.sh ]; then bash run-living-painting-tests.sh 2>&1 | tail -n 60; fi
          if [ -f run-timing-track-tests.sh ]; then bash run-timing-track-tests.sh 2>&1 | tail -n 60; fi
          if [ -f run-live-face-tests.sh ]; then bash run-live-face-tests.sh 2>&1 | tail -n 60; fi
          if [ -f run-ask-to-join-tests.sh ]; then bash run-ask-to-join-tests.sh 2>&1 | tail -n 40; fi
          if [ -f run-soul-tests.sh ]; then bash run-soul-tests.sh 2>&1 | tail -n 20; fi
          if [ -f run-arcade-tests.sh ]; then bash run-arcade-tests.sh 2>&1 | tail -n 20; fi
          if [ -f run-library-browse-tests.sh ]; then bash run-library-browse-tests.sh 2>&1 | tail -n 20; fi
          if [ -f run-library-player-tests.sh ]; then bash run-library-player-tests.sh 2>&1 | tail -n 40; fi
          if [ -f run-voice-sync-tests.sh ]; then bash run-voice-sync-tests.sh 2>&1 | tail -n 20; fi
          if [ -f run-push-tests.sh ]; then bash run-push-tests.sh 2>&1 | tail -n 20; fi
          if [ -f run-waiting-chime-tests.sh ]; then bash run-waiting-chime-tests.sh 2>&1 | tail -n 20; fi
          if [ -f run-audio-session-tests.sh ]; then bash run-audio-session-tests.sh 2>&1 | tail -n 20; fi
          if [ -f run-follow-along-tests.sh ]; then bash run-follow-along-tests.sh 2>&1 | tail -n 40; fi

      - name: Generate the simulator project
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 dev/prepare-della-articulated-review.py --prepare
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Compile the app for the simulator, unsigned
        id: compile
        timeout-minutes: 25
        run: |
          set -o pipefail
          # The step shell stops at the first failing command, so keep the
          # build's status instead of letting a failure skip its summary.
          status=0
          xcodebuild -jobs 3 -project KadeAI.xcodeproj -scheme KadeAI -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/check CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= build > build.log 2>&1 || status=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u | head -n 200 || true
          if [ "$status" -ne 0 ]; then
            grep -n -E "error|failed|Failed|Stack dump" build.log | tail -n 60 || true
            tail -n 40 build.log || true
          fi
          exit $status

      # Nov 14 2026 (Tellavision Follow along): syncprint.js must ride in the
      # app as a resource, byte for byte (its checksum is the server's too).
      - name: Follow along's syncprint.js is inside the app
        if: ${{ steps.compile.outcome == 'success' && hashFiles('Sources/syncprint.js') != '' }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          app="build/check/Build/Products/Debug-iphonesimulator/KadeAI.app"
          if [ ! -f "$app/syncprint.js" ]; then
            echo "syncprint.js is missing from $app"
            exit 1
          fi
          want="$(shasum -a 256 Sources/syncprint.js | cut -d' ' -f1)"
          got="$(shasum -a 256 "$app/syncprint.js" | cut -d' ' -f1)"
          echo "syncprint.js in the app: $got"
          test "$want" = "$got"

      # Timing only: one match in Apple's jsc shell, with the JIT and without
      # it (an app's JavaScriptCore has no JIT). Never fails the check.
      - name: Follow along match timing in jsc
        if: ${{ steps.compile.outcome == 'success' && hashFiles('dev/follow-along/time-match.js') != '' }}
        continue-on-error: true
        timeout-minutes: 8
        run: |
          jsc=""
          for candidate in \
            /System/Library/Frameworks/JavaScriptCore.framework/Versions/Current/Helpers/jsc \
            /System/Library/Frameworks/JavaScriptCore.framework/Versions/A/Helpers/jsc \
            /System/Library/Frameworks/JavaScriptCore.framework/Helpers/jsc \
            /System/Library/Frameworks/JavaScriptCore.framework/Versions/A/Resources/jsc; do
            if [ -x "$candidate" ]; then jsc="$candidate"; break; fi
          done
          if [ -z "$jsc" ]; then
            echo "No jsc command on this Mac; the Follow along tests timed the match in JavaScriptCore instead."
            exit 0
          fi
          echo "JIT on:"
          "$jsc" Sources/syncprint.js dev/follow-along/time-match.js || true
          echo "JIT off:"
          "$jsc" --useJIT=false Sources/syncprint.js dev/follow-along/time-match.js || true

      - name: Puppet gallery screenshots
        id: gallery
        if: ${{ steps.compile.outcome == 'success' && hashFiles('dev/puppet-gallery.sh') != '' }}
        continue-on-error: true
        timeout-minutes: 45
        run: bash dev/puppet-gallery.sh build/check

      - name: Keep the gallery for review
        if: ${{ always() && hashFiles('build/gallery/*.png') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: puppet-gallery
          path: build/gallery/*.png
          retention-days: 5

      - name: Fail when the model tests failed
        if: ${{ steps.models.outcome == 'failure' }}
        run: exit 1
