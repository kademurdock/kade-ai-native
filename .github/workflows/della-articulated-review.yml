name: Della articulated body unsigned review

'on':
  push:
    branches: [codex/puppet-articulated-bodies-20261009]
    paths:
      - '.github/workflows/della-articulated-review.yml'
      - 'dev/della-articulated-audit.py'
      - 'dev/prepare-puppet-review.py'
      - 'dev/prepare-della-articulated-review.py'
      - 'dev/della-articulated-review/**'
      - 'dev/validate-angel-vector.py'
      - 'Sources/**'
      - 'CharacterMotionTests/**'
      - 'FreshAgentChatTests/**'
      - 'run-character-tests.sh'
      - 'run-fresh-agent-chat-tests.sh'
      - 'project.yml'

permissions:
  contents: read

concurrency:
  group: della-articulated-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-review:
    # Evaluate before allocating a runner. The JSON test closes loose equality
    # on missing/null metadata; only this exact public source branch may run.
    if: >-
      github.event_name == 'push' &&
      github.event.repository.private == false &&
      toJSON(github.event.repository.private) == 'false' &&
      github.repository == 'kademurdock/kade-ai-native' &&
      github.ref == 'refs/heads/codex/puppet-articulated-bodies-20261009' &&
      toJSON(github.event.deleted) == 'false'
    # Standard public-repository M1 runner, retaining the fixed Xcode/runtime.
    # This host has already compiled and rendered the candidate successfully.
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      KADE_EXPECTED_COMMIT: ${{ github.sha }}
      KADE_CHARACTER_AUDIT: '1'
      KADE_DELLA_ARTICULATED_AUDIT: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Check out the exact public candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact source, immutable art and public runner scope
        run: |
          set -euo pipefail
          python3 dev/della-articulated-audit.py source --expected-sha "$KADE_EXPECTED_COMMIT"
          python3 dev/prepare-puppet-review.py --check
          python3 dev/prepare-della-articulated-review.py
          python3 dev/validate-angel-vector.py
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.4.1'

      - name: Run existing character, motion-policy and exact-identity model checks
        run: bash run-character-tests.sh

      - name: Stage the optional immutable review art and generate the simulator project
        run: |
          set -euo pipefail
          python3 dev/prepare-della-articulated-review.py --prepare
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Compile unsigned native Debug
        run: |
          set -euo pipefail
          mkdir -p della-articulated-audit
          xcodebuild -jobs 2 -project KadeAI.xcodeproj -scheme KadeAI -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/della-articulated-simulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= DEVELOPMENT_TEAM= \
            build > della-articulated-audit/compile.log 2>&1 || { tail -n 80 della-articulated-audit/compile.log; exit 1; }

      - name: Capture the silent Della native fixture
        run: python3 dev/della-articulated-audit.py capture --expected-sha "$KADE_EXPECTED_COMMIT"

      - name: Remove the optional study catalog after the simulator review
        if: ${{ always() }}
        run: python3 dev/prepare-della-articulated-review.py --clean

      - name: Emit bounded screenshot and receipt evidence through free job logs
        if: ${{ always() }}
        run: python3 dev/della-articulated-audit.py emit --expected-sha "$KADE_EXPECTED_COMMIT"
        # No upload-artifact or cache action: log evidence avoids storage billing.
