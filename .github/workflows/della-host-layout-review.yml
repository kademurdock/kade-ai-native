name: Della full host layout unsigned review

'on':
  push:
    branches: [codex/puppet-body-host-layout-20261010]
    paths:
      - '.github/workflows/della-host-layout-review.yml'
      - 'dev/della-host-layout-audit.py'
      - 'dev/prepare-puppet-review.py'
      - 'dev/prepare-della-articulated-review.py'
      - 'dev/della-articulated-review/**'
      - 'dev/validate-angel-vector.py'
      - 'Sources/**'
      - 'CharacterMotionTests/**'
      - 'FreshAgentChatTests/**'
      - 'UITests/**'
      - 'run-character-tests.sh'
      - 'run-fresh-agent-chat-tests.sh'
      - 'project.yml'

permissions:
  contents: read

concurrency:
  group: della-host-layout-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-review:
    # Evaluate before allocating the fixed standard public-repository runner.
    # The JSON comparison rejects null/missing private metadata.
    if: >-
      github.event_name == 'push' &&
      github.event.repository.private == false &&
      toJSON(github.event.repository.private) == 'false' &&
      github.repository == 'kademurdock/kade-ai-native' &&
      github.ref == 'refs/heads/codex/puppet-body-host-layout-20261010' &&
      toJSON(github.event.deleted) == 'false'
    runs-on: macos-26
    # Two real phone devices and twenty-eight actual host cases,
    # and targeted UI-tree tests share one compiled app and a finite job budget.
    timeout-minutes: 55
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      KADE_EXPECTED_COMMIT: ${{ github.sha }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - name: Initialize the shared operation deadline before checkout
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          import os
          started=datetime.now(timezone.utc)
          with open(os.environ['GITHUB_ENV'],'a') as target:
              target.write('KADE_HOST_OPERATION_STARTED_UTC='+started.isoformat()+'\n')
              target.write('KADE_HOST_OPERATION_DEADLINE_UTC='+(started+timedelta(minutes=52)).isoformat()+'\n')
          PY

      - name: Check out the exact public host candidate source
        timeout-minutes: 3
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source, unchanged approved puppet and public scope
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 dev/della-host-layout-audit.py source --expected-sha "$KADE_EXPECTED_COMMIT"
          python3 dev/prepare-puppet-review.py --check
          python3 dev/prepare-della-articulated-review.py
          python3 dev/validate-angel-vector.py
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 26.4.1'

      - name: Run character, motion, host layout and routing model checks
        timeout-minutes: 5
        run: bash run-character-tests.sh

      - name: Require both real phone device types on installed iOS26.4
        timeout-minutes: 5
        run: python3 dev/della-host-layout-audit.py preflight --expected-sha "$KADE_EXPECTED_COMMIT"

      - name: Stage unchanged optional review art and generate simulator project
        timeout-minutes: 10
        run: |
          set -euo pipefail
          python3 dev/prepare-della-articulated-review.py --prepare
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate

      - name: Compile unsigned native app and targeted test runner once
        id: compiled-tests
        timeout-minutes: 16
        run: python3 dev/della-host-layout-audit.py build-tests --expected-sha "$KADE_EXPECTED_COMMIT"

      - name: Explicitly boot the actual Pro Max and require native readiness
        id: ui-boot-large
        if: ${{ always() && !cancelled() && steps.compiled-tests.outcome == 'success' }}
        timeout-minutes: 8
        run: python3 dev/della-host-layout-audit.py boot-ui --expected-sha "$KADE_EXPECTED_COMMIT" --device large

      - name: Test sixteen Pro Max cases with the exact compiled runner
        id: ui-large
        if: ${{ always() && !cancelled() && steps.ui-boot-large.outcome == 'success' }}
        # Python retains the unchanged600-second test cap, then bounded cleanup.
        timeout-minutes: 12
        run: python3 dev/della-host-layout-audit.py run-ui --expected-sha "$KADE_EXPECTED_COMMIT" --device large

      - name: Explicitly boot the actual SE and require native readiness
        id: ui-boot-small
        if: ${{ always() && !cancelled() && steps.compiled-tests.outcome == 'success' }}
        timeout-minutes: 8
        run: python3 dev/della-host-layout-audit.py boot-ui --expected-sha "$KADE_EXPECTED_COMMIT" --device small

      - name: Test eight SE cases with the exact compiled runner
        id: ui-small
        if: ${{ always() && !cancelled() && steps.ui-boot-small.outcome == 'success' }}
        # Python retains the unchanged480-second test cap, then bounded cleanup.
        timeout-minutes: 10
        run: python3 dev/della-host-layout-audit.py run-ui --expected-sha "$KADE_EXPECTED_COMMIT" --device small

      - name: Always retain UI diagnostics and require both complete native results
        id: native-ui-results
        if: ${{ always() }}
        timeout-minutes: 2
        run: python3 dev/della-host-layout-audit.py ui-tests --expected-sha "$KADE_EXPECTED_COMMIT"

      - name: Capture twenty-eight silent hosts only after both UI groups pass
        id: host-capture
        if: ${{ always() && !cancelled() && steps.native-ui-results.outcome == 'success' }}
        run: python3 dev/della-host-layout-audit.py capture --expected-sha "$KADE_EXPECTED_COMMIT"

      - name: Always remove optional study catalog
        timeout-minutes: 1
        if: ${{ always() }}
        run: python3 dev/della-host-layout-audit.py clean-review --expected-sha "$KADE_EXPECTED_COMMIT"

      - name: Emit bounded host PNG and receipt evidence through free logs
        timeout-minutes: 1
        if: ${{ always() }}
        run: python3 dev/della-host-layout-audit.py emit --expected-sha "$KADE_EXPECTED_COMMIT"
        # No artifact storage, cache, signing, app archive, deployment or release.
