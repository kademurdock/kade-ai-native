name: Bounded pre-app simulator diagnostic
'on':
  push:
    branches: [codex/provider-pace-simctl-diagnostic-20261015]
permissions:
  contents: read
concurrency:
  group: provider-pace-simctl-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pre-app-simctl:
    if: >-
      github.event_name == 'push' &&
      github.event.repository.private == false &&
      toJSON(github.event.repository.private) == 'false' &&
      github.repository == 'kademurdock/kade-ai-native' &&
      github.ref == 'refs/heads/codex/provider-pace-simctl-diagnostic-20261015' &&
      toJSON(github.event.deleted) == 'false'
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
    steps:
      - name: Read exact public diagnostic source without persisted credentials
        timeout-minutes: 1
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 7
          persist-credentials: false
      - name: Measure pre-app simulator appearance and resource timing only
        timeout-minutes: 9
        run: python3 -B dev/provider-pace-simctl-diagnostic.py
