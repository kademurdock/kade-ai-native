name: Conversation puppet model compile

'on':
  push:
    branches: [codex/puppet-completion-model-20261011]

permissions:
  contents: read

concurrency:
  group: puppet-completion-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pure-models:
    if: >-
      github.event_name == 'push' &&
      github.event.repository.private == false &&
      toJSON(github.event.repository.private) == 'false' &&
      github.repository == 'kademurdock/kade-ai-native' &&
      github.ref == 'refs/heads/codex/puppet-completion-model-20261011' &&
      toJSON(github.event.deleted) == 'false'
    runs-on: macos-26
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact public candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Compile and check the pure presentation models
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          bash run-character-tests.sh
          bash run-speech-tests.sh
        # The output contains model summaries only. No signing material, app
        # packages, artifacts, caches or account data leave this job.
