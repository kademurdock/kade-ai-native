name: Puppet production unsigned device verification

'on':
  push:
    branches: [codex/puppet-idle-device-20261014]

permissions:
  contents: read

concurrency:
  group: puppet-production-device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unsigned-release-device:
    # Only this exact public repository/branch can allocate the standard runner.
    if: >-
      github.event_name == 'push' &&
      github.event.repository.private == false &&
      toJSON(github.event.repository.private) == 'false' &&
      github.repository == 'kademurdock/kade-ai-native' &&
      github.ref == 'refs/heads/codex/puppet-idle-device-20261014' &&
      toJSON(github.event.deleted) == 'false'
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.4.1.app/Contents/Developer
      KADE_EXPECTED_COMMIT: ${{ github.sha }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Start the finite operation budget before checkout
        run: |
          set -euo pipefail
          echo "KADE_DEVICE_STARTED_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out the exact public production source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # official v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify source, models and unsigned Release app with extensions
        run: python3 -B dev/verify-puppet-production-device.py --expected-sha "$KADE_EXPECTED_COMMIT"
        # Bounded JSON/digests go through job logs. No artifacts, caches,
        # signing credentials, archive/export, publication or deployment.
