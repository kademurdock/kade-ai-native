# Native SwiftUI Kade-AI app -> internal TestFlight.
# Reuses the SAME signing setup as kade-ai-app: ASC integration KadeAI_ASC_Key +
# secure var CERT_KEY in group `signing` (never regenerate the cert or installs break).
workflows:
  ios-native-testflight:
    name: Kade-AI Native iOS -> TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: KadeAI_ASC_Key
    environment:
      groups:
        - signing
      vars:
        BUNDLE_ID: "com.kademurdock.kadeai"
        APP_STORE_APPLE_ID: 6791024001
      xcode: latest
    scripts:
      - name: Generate Xcode project (XcodeGen)
        script: |
          set -e
          brew install xcodegen || brew link --overwrite xcodegen
          xcodegen generate
      - name: Set up code signing (reusable certificate)
        script: |
          set -e
          keychain initialize
          printf '%s' "$CERT_KEY" | openssl base64 -d -A > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          # July 28 2026 (keyboard extension attempt): the extension is its
          # own bundle id and needs its own App Store profile. --create
          # registers the id in the developer portal on first run via the
          # same ASC integration. If THIS line is what a red build points
          # at, the ASC key's role can't create bundle ids -- register
          # com.kademurdock.kadeai.keyboard by hand in the portal and rerun.
          app-store-connect fetch-signing-files "$BUNDLE_ID.keyboard" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Auto-increment the TestFlight build number (floor 100 for native)
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$(($LATEST + 1)); [ $NEXT -lt 100 ] && NEXT=100
          agvtool new-version -all $NEXT
      - name: Build signed .ipa
        script: |
          xcode-project build-ipa \
            --project "KadeAI.xcodeproj" \
            --scheme "KadeAI"
      - name: Simulator screenshots — the App Store tour (blind-friendly loop)
        script: |
          set -e
          # The issuer id is NOT part of the screenshot tour and other lanes
          # read it as an artifact, so it is emitted BEFORE the skip guard --
          # gating the tour must not quietly stop producing it.
          printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" > "$CM_BUILD_DIR/asc-issuer.txt" || true
          # ⭐ OFF BY DEFAULT (Aug 19 2026, her call: "we don't need the
          # screenshots thing until we're on appstore right?"). She is right,
          # and it was the single most expensive step in the file: it runs a
          # SECOND full xcodebuild (a debug simulator build, on top of the
          # release archive above), boots a simulator, installs, launches, and
          # sits through a 7x7s capture loop -- roughly half the wall time of
          # the whole build, on EVERY TestFlight build, to produce images only
          # an App Store submission ever uses.
          #
          # Context that made this bite: the 204-225 freeze hunt burned the
          # 500 free Mac minutes for August, so builds now cost $0.095/min.
          # Halving the build halves that, and doubles what next month's free
          # tier buys.
          #
          # TURN IT BACK ON WITHOUT EDITING THIS FILE -- trigger the build with
          # KADE_TOUR_SHOTS=1 in the environment (the Codemagic API accepts
          # environment.variables on the trigger). That matters because the
          # App Store 2.0 submission is still pending and WILL need these
          # frames again; this must be one flag, not an archaeology exercise.
          if [ "${KADE_TOUR_SHOTS:-0}" != "1" ]; then
            echo "Skipping the App Store screenshot tour (KADE_TOUR_SHOTS is not 1)."
            echo "Re-run with KADE_TOUR_SHOTS=1 when you need store frames."
            exit 0
          fi
          # July 31 2026, the App Store sprint: prefer a Pro Max simulator so
          # frames land at an accepted store size (1290x2796 / 1320x2868).
          # The DEBUG sim build contains the tour (auto sign-in on the TEST
          # seat + a timed walk of the best rooms); the Release archive
          # above contains none of it.
          SIM=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin);devs=[dev for l in d['devices'].values() for dev in l if 'iPhone' in dev['name']];pm=[x for x in devs if 'Pro Max' in x['name']];print((pm or devs)[0]['udid'])") || exit 0
          xcrun simctl boot "$SIM" || true
          xcodebuild -project KadeAI.xcodeproj -scheme KadeAI -destination "id=$SIM" -derivedDataPath /tmp/dd build || exit 0
          APP=$(find /tmp/dd -name "KadeAI.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$SIM" "$APP" || exit 0
          SIMCTL_CHILD_KADE_TOUR=1 \
          SIMCTL_CHILD_KADE_TOUR_EMAIL="kadeai.vischeck722@gmail.com" \
          SIMCTL_CHILD_KADE_TOUR_PASS="T3st!Check722" \
          xcrun simctl launch "$SIM" com.kademurdock.kadeai || exit 0
          for i in 1 2 3 4 5 6 7; do
            sleep 7
            xcrun simctl io "$SIM" screenshot "$CM_BUILD_DIR/tour-$i.png" || true
          done
          # (asc-issuer.txt is written at the TOP of this step now, before the
          # skip guard, so it is produced whether or not the tour runs.)
    artifacts:
      - build/ios/ipa/*.ipa
      - tour-*.png
      - asc-issuer.txt
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers only -> instant, no Apple review.
        submit_to_testflight: false
      email:
        recipients:
          - kademurdock@gmail.com
        notify:
          success: true
          failure: true
