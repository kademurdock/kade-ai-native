# Native SwiftUI Kade-AI app -> internal TestFlight.
# Reuses the SAME signing setup as kade-ai-app: ASC integration KadeAI_ASC_Key +
# secure var CERT_KEY in group `signing` (never regenerate the cert or installs break).
workflows:
  ios-native-testflight:
    name: Kade-AI Native iOS -> TestFlight
    max_build_duration: 45
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: KadeAI_ASC_Key
    environment:
      groups:
        - signing
      vars:
        BUNDLE_ID: "com.kademurdock.kadeai"
        APP_STORE_APPLE_ID: 6791024001
      xcode: latest
    scripts:
      # PART 92.12 — THE SPEECH TESTS ARE A PUBLISH GATE NOW, NOT A GOOD HABIT.
      #
      # Forge's call, Aug 25 2026, asked for before shipping a speech change:
      # in August FOUR compile-green builds in a row were wrong on her phone,
      # and every one of them was wrong in the dimension a compile gate cannot
      # see — runtime timing and audio behaviour. run-speech-tests.sh existed
      # the whole time and was a thing sessions were trusted to remember.
      #
      # It runs FIRST, before signing and before the build, so a red suite
      # costs seconds of Mac time instead of a full build. Non-zero exits the
      # workflow, so there is no path from a broken splitter to TestFlight.
      #
      # It needs swiftc, which Xcode already provides here — the same script
      # refuses to run in an agent sandbox, where the toolchain wants ~3 GB
      # that a session does not have. That asymmetry is exactly why this
      # belongs on the Mac: it is the only machine in the chain that can.
      - name: Speech pipeline tests (gate — a red suite blocks the build)
        script: |
          set -e
          ./run-speech-tests.sh
      - name: Generate Xcode project (XcodeGen)
        script: |
          set -e
          brew install xcodegen || brew link --overwrite xcodegen
          xcodegen generate
      - name: Set up code signing (reusable certificate)
        script: |
          set -e
          keychain initialize
          printf '%s' "$CERT_KEY" | openssl base64 -d -A > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          # July 28 2026 (keyboard extension attempt): the extension is its
          # own bundle id and needs its own App Store profile. --create
          # registers the id in the developer portal on first run via the
          # same ASC integration. If THIS line is what a red build points
          # at, the ASC key's role can't create bundle ids -- register
          # com.kademurdock.kadeai.keyboard by hand in the portal and rerun.
          app-store-connect fetch-signing-files "$BUNDLE_ID.keyboard" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          # Part 120 (Sep 3 2026) — the share extension, third bundle id.
          # Same --create story as the keyboard: if THIS line is what a red
          # build points at, the ASC key's role cannot create bundle ids, so
          # register com.kademurdock.kadeai.share by hand in the developer
          # portal (Identifiers > App IDs, App Groups capability on, group
          # group.com.kademurdock.kadeai assigned) and rerun. Nothing else in
          # the build depends on it — the app itself signs and ships either
          # way, which is why the Sound Booth went out on its own build first.
          # PARKED with the target itself (project.yml has the whole story
          # and the one-minute portal step). Fetching a profile for a target
          # that is not built is harmless but misleading in the log, and the
          # day the portal step is done this line and the target come back
          # together.
          app-store-connect fetch-signing-files "$BUNDLE_ID.share" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Auto-increment the TestFlight build number (floor 100 for native)
        script: |
          set -e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          NEXT=$(($LATEST + 1)); [ $NEXT -lt 100 ] && NEXT=100
          agvtool new-version -all $NEXT
      - name: Build signed .ipa
        script: |
          set -o pipefail
          # Part 121: the archive's OWN errors, captured. Two failed builds
          # (266, 267) ended in "Failed to archive" with nothing else the API
          # could show, and the cause was guessed. Now the first real
          # xcodebuild error lines land in an artifact the next session can
          # read — the same doctrine as the compile gate's first-errors.txt.
          xcode-project build-ipa \
            --project "KadeAI.xcodeproj" \
            --scheme "KadeAI" 2>&1 | tee "$CM_BUILD_DIR/build-ipa.log"
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            grep -m 12 -E '(error:|error :|Provisioning profile|doesn.t (include|support)|entitlement)' "$CM_BUILD_DIR/build-ipa.log" \
              > "$CM_BUILD_DIR/archive-first-errors.txt" || true
            echo "--- archive first errors ---"
            cat "$CM_BUILD_DIR/archive-first-errors.txt"
            exit $STATUS
          fi
      - name: Simulator screenshots — the App Store tour (blind-friendly loop)
        script: |
          set -e
          # The issuer id is NOT part of the screenshot tour and other lanes
          # read it as an artifact, so it is emitted BEFORE the skip guard --
          # gating the tour must not quietly stop producing it.
          printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" > "$CM_BUILD_DIR/asc-issuer.txt" || true
          # ⭐ OFF BY DEFAULT (Aug 19 2026, her call: "we don't need the
          # screenshots thing until we're on appstore right?"). She is right,
          # and it was the single most expensive step in the file: it runs a
          # SECOND full xcodebuild (a debug simulator build, on top of the
          # release archive above), boots a simulator, installs, launches, and
          # sits through a 7x7s capture loop -- roughly half the wall time of
          # the whole build, on EVERY TestFlight build, to produce images only
          # an App Store submission ever uses.
          #
          # Context that made this bite: the 204-225 freeze hunt burned the
          # 500 free Mac minutes for August, so builds now cost $0.095/min.
          # Halving the build halves that, and doubles what next month's free
          # tier buys.
          #
          # TURN IT BACK ON WITHOUT EDITING THIS FILE -- trigger the build with
          # KADE_TOUR_SHOTS=1 in the environment (the Codemagic API accepts
          # environment.variables on the trigger). That matters because the
          # App Store 2.0 submission is still pending and WILL need these
          # frames again; this must be one flag, not an archaeology exercise.
          if [ "${KADE_TOUR_SHOTS:-0}" != "1" ]; then
            echo "Skipping the App Store screenshot tour (KADE_TOUR_SHOTS is not 1)."
            echo "Re-run with KADE_TOUR_SHOTS=1 when you need store frames."
            exit 0
          fi
          # July 31 2026, the App Store sprint: prefer a Pro Max simulator so
          # frames land at an accepted store size (1290x2796 / 1320x2868).
          # The DEBUG sim build contains the tour (auto sign-in on the TEST
          # seat + a timed walk of the best rooms); the Release archive
          # above contains none of it.
          SIM=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin);devs=[dev for l in d['devices'].values() for dev in l if 'iPhone' in dev['name']];pm=[x for x in devs if 'Pro Max' in x['name']];print((pm or devs)[0]['udid'])") || exit 0
          xcrun simctl boot "$SIM" || true
          xcodebuild -project KadeAI.xcodeproj -scheme KadeAI -destination "id=$SIM" -derivedDataPath /tmp/dd build || exit 0
          APP=$(find /tmp/dd -name "KadeAI.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$SIM" "$APP" || exit 0
          SIMCTL_CHILD_KADE_TOUR=1 \
          SIMCTL_CHILD_KADE_TOUR_EMAIL="kadeai.vischeck722@gmail.com" \
          SIMCTL_CHILD_KADE_TOUR_PASS="T3st!Check722" \
          xcrun simctl launch "$SIM" com.kademurdock.kadeai || exit 0
          for i in 1 2 3 4 5 6 7; do
            sleep 7
            xcrun simctl io "$SIM" screenshot "$CM_BUILD_DIR/tour-$i.png" || true
          done
          # (asc-issuer.txt is written at the TOP of this step now, before the
          # skip guard, so it is produced whether or not the tour runs.)
    artifacts:
      - build/ios/ipa/*.ipa
      - tour-*.png
      - asc-issuer.txt
      - archive-first-errors.txt
      - build-ipa.log
    publishing:
      app_store_connect:
        auth: integration
        # Internal testers only -> instant, no Apple review.
        submit_to_testflight: false
      email:
        recipients:
          - kademurdock@gmail.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────────────────────
  # PART 88 — THE COMPILE GATE. Kade's ask, in her words: "I've also wondered
  # about somehow giving it access to a swift compiler."
  #
  # She already owns one: this Mac. Swift for iOS only compiles on macOS — no
  # container, no Linux sandbox, no amount of cleverness changes that, and it is
  # Apple's rule rather than a gap in our setup. So the harness does not need a
  # compiler; it needs a phone line to the Mac she already rents. This workflow
  # is that line.
  #
  # WHAT IT DELIBERATELY DOES NOT DO, and why each omission is load-bearing:
  #   · NO app_store_connect integration — an experiment CANNOT publish. There is
  #     no path from this workflow to her phone, by construction rather than by
  #     policy.
  #   · NO signing, NO certificates, NO keychain — a simulator build needs none of
  #     it, and every one of those steps is minutes of Mac time.
  #   · NO screenshot tour, NO .ipa, NO build-number bump — nothing that touches
  #     TestFlight's numbering or her install.
  # What is left is the only question Forge actually needs answered: DOES IT BUILD.
  #
  # COST IS MINUTES, NOT DOLLARS-PER-CALL. August's 500 free Mac minutes were
  # burned by the 204-225 freeze hunt, so Mac time bills at $0.095/min. A full
  # TestFlight build ran ~12 minutes; this should land well under that because it
  # skips signing and archiving. The harness caps how many of these can run per
  # day (KADE_COMPILE_DAILY_CAP, default 6) so a loop cannot eat the month.
  ios-compile-check:
    name: Kade-AI Native — compile check only (no signing, no publish)
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      # PART 92.12 — the speech suite runs HERE TOO, and this is the lane that
      # matters most: no ASC integration, no signing, no path to her phone, so a
      # session can get a REAL red/green on a speech change for a few cents and
      # zero risk. run-speech-tests.sh refuses to run in an agent sandbox (the
      # Swift toolchain wants ~3 GB that a session does not have), which meant
      # the honest state of a splitter change was "compiles in my head" until
      # this existed. It runs FIRST so a red suite costs seconds, not a build.
      - name: Speech pipeline tests (the real gate for splitter changes)
        script: |
          set -e
          ./run-speech-tests.sh 2>&1 | tee "$CM_BUILD_DIR/speech-tests.log"
      - name: Generate Xcode project (XcodeGen)
        script: |
          set -e
          brew install xcodegen || brew link --overwrite xcodegen
          xcodegen generate
      - name: Compile for the simulator (no signing)
        script: |
          set -o pipefail
          # -sdk iphonesimulator + CODE_SIGNING_ALLOWED=NO is what makes this
          # need no certificate at all. A device build would demand signing and
          # signing is the half that can reach her phone.
          xcodebuild \
            -project KadeAI.xcodeproj \
            -scheme KadeAI \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/compile.log"
          STATUS=$?
          # THE GATE'S OWN DOCTRINE: say the FIRST REAL ERROR with its file and
          # line, never "looks good" and never a wall of log. This file is what
          # the harness reads back to Forge, and Forge reads it to Kade out loud.
          if [ $STATUS -ne 0 ]; then
            grep -m 5 -E '(error:|error :)' "$CM_BUILD_DIR/compile.log" \
              > "$CM_BUILD_DIR/first-errors.txt" || true
            echo "--- first errors ---"
            cat "$CM_BUILD_DIR/first-errors.txt"
          else
            echo "Compiled clean." > "$CM_BUILD_DIR/first-errors.txt"
          fi
          exit $STATUS
    artifacts:
      - first-errors.txt
      - compile.log
      - speech-tests.log

  # ─────────────────────────────────────────────────────────────────────────────
  # GAP 3 — APPLE'S OWN ACCESSIBILITY AUDIT. The third no-signing workflow.
  #
  # Xcode ships performAccessibilityAudit() (XCUITest, Xcode 15+): Apple's own
  # automated check for missing labels, low contrast, Dynamic Type truncation
  # and tap targets too small to hit — run against the REAL rendered app in a
  # simulator, not against source. The native app's accessibility has been
  # guarded by hand-discipline until now. This makes it measurable.
  #
  # SAME OMISSIONS AS ios-compile-check, SAME REASONS:
  #   · NO app_store_connect integration — cannot publish, cannot reach her phone.
  #   · NO signing, NO certificates, NO keychain — a simulator build needs none.
  #   · NO screenshot tour, NO .ipa, NO build-number bump.
  #
  # ⚠️ COST IS THE REAL CONSTRAINT AND IT IS BIGGER THAN COMPILE. This does
  # everything ios-compile-check does (~2m16s measured) and then boots a
  # simulator, installs, signs in, and walks nine screens auditing each — call
  # it 8–12 minutes, so roughly 75¢–$1.15 at August's $0.095/min. That is a
  # dollar a run, not a tenth of a cent. The harness caps it separately from
  # compile (KADE_A11Y_DAILY_CAP, default 2) and says the number out loud.
  #
  # ⚠️ THE TEST SEAT'S CREDENTIALS DO NOT LIVE IN THIS FILE. Put them in a
  # Codemagic environment group named `a11y` as KADE_A11Y_EMAIL and
  # KADE_A11Y_PASS. Without them the run still works and audits the sign-in
  # screen, and the report says which screens it could not reach — an honest
  # partial, never a silent one. (See SECURITY_NOTE_test_seat_credentials.md
  # for why this file, unlike its neighbour, keeps its mouth shut.)
  ios-a11y-audit:
    name: Kade-AI Native — accessibility audit (no signing, no publish)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      # ⚠️ FIRST RUN IS DELIBERATELY CREDENTIAL-FREE. With no test seat the walk
      # audits the SIGN-IN SCREEN ONLY and says so out loud — which is the
      # cheapest honest way to prove the whole pipe (XcodeGen -> test target
      # builds -> simulator boots -> audit runs -> report lands in an artifact)
      # before spending Mac minutes on a nine-screen walk.
      #
      # TO AUDIT THE SIGNED-IN SCREENS: create a Codemagic environment group
      # called `a11y` holding KADE_A11Y_EMAIL and KADE_A11Y_PASS (both secured,
      # a throwaway seat, never Kade's own), then uncomment the two lines below.
      # The credentials NEVER appear in this file — see
      # SECURITY_NOTE_test_seat_credentials_2026-08-23.md for why that rule is
      # written down rather than assumed.
      # groups:
      #   - a11y
      xcode: latest
    scripts:
      - name: Generate Xcode project (XcodeGen)
        script: |
          set -e
          brew install xcodegen || brew link --overwrite xcodegen
          xcodegen generate

      - name: Walk the app and run Apple's accessibility audit
        script: |
          set -o pipefail
          # Pick a real simulator by udid rather than by name: the runner's
          # available device list changes with every Xcode bump, and a
          # hard-coded "iPhone 15" turns a routine image update into a red
          # build that names nothing.
          SIM=$(xcrun simctl list devices available -j | python3 -c "import sys,json;d=json.load(sys.stdin);devs=[dev for l in d['devices'].values() for dev in l if 'iPhone' in dev['name']];pm=[x for x in devs if 'Pro' in x['name']];print((pm or devs)[0]['udid'])")
          echo "Simulator: $SIM"
          xcrun simctl boot "$SIM" || true

          # TEST_RUNNER_-prefixed settings are handed to the UI-test runner
          # process with the prefix stripped — that is how the credentials
          # reach ProcessInfo inside the test without ever being written down
          # in the repo. Empty is fine and handled: the test says which
          # screens it skipped.
          xcodebuild \
            -project KadeAI.xcodeproj \
            -scheme KadeAIA11yAudit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM" \
            -derivedDataPath /tmp/a11y-dd \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            TEST_RUNNER_KADE_A11Y_EMAIL="${KADE_A11Y_EMAIL:-}" \
            TEST_RUNNER_KADE_A11Y_PASS="${KADE_A11Y_PASS:-}" \
            test 2>&1 | tee "$CM_BUILD_DIR/a11y.log"
          STATUS=$?

          # THE GATE'S OWN DOCTRINE, SAME AS THE COMPILE LANE: hand back the
          # findings themselves, never "looks good" and never a wall of log.
          # This file is what the harness reads and Forge reads aloud.
          grep -E '^KADE_A11Y' "$CM_BUILD_DIR/a11y.log" \
            > "$CM_BUILD_DIR/a11y-issues.txt" || true

          # ⚠️ XCODEBUILD'S EXIT CODE IS NOT THE VERDICT HERE, AND THAT IS
          # DELIBERATE. The test swallows every finding, so a normal run exits
          # 0 whether the app is perfect or a disaster — the REPORT carries the
          # verdict. A non-zero $STATUS means something structural broke
          # (simulator, install, a crash mid-walk), which the missing-summary
          # check below already catches; it is echoed so a red run says which
          # kind of red it was.
          if ! grep -q '^KADE_A11Y_SUMMARY' "$CM_BUILD_DIR/a11y-issues.txt"; then
            echo "KADE_A11Y_BROKEN|the audit never reported a summary — the walk did not finish (xcodebuild exit $STATUS)" \
              >> "$CM_BUILD_DIR/a11y-issues.txt"
            grep -m 5 -E '(error:|Testing failed|Failing tests)' "$CM_BUILD_DIR/a11y.log" \
              >> "$CM_BUILD_DIR/a11y-issues.txt" || true
            echo "--- audit report ---"; cat "$CM_BUILD_DIR/a11y-issues.txt"
            exit 1
          fi

          echo "--- audit report ---"
          cat "$CM_BUILD_DIR/a11y-issues.txt"

          # REPORT-ONLY BY DEFAULT, ON PURPOSE. Apple's audit has known
          # false-positive classes, and a guard that cries wolf gets switched
          # off — that scar is already paid for twice on this platform. The
          # lane reports until its findings have been checked against the real
          # app; KADE_A11Y_STRICT=1 (set on the trigger, no file edit) makes
          # findings fail the build the day it has earned that.
          if [ "${KADE_A11Y_STRICT:-0}" = "1" ]; then
            # ⚠️ `grep -c` PRINTS 0 AND EXITS 1 WHEN IT FINDS NOTHING, so the
            # obvious `$(grep -c … || echo 0)` yields the two-line string
            # "0\n0" and then `[ … -gt 0 ]` dies on it — a clean app failing
            # the gate with a shell error. head -1 is the fix.
            ISSUES=$(grep -c '^KADE_A11Y_ISSUE' "$CM_BUILD_DIR/a11y-issues.txt" 2>/dev/null | head -1)
            ISSUES=${ISSUES:-0}
            if [ "$ISSUES" -gt 0 ]; then exit 1; fi
          fi
          exit 0
    artifacts:
      - a11y-issues.txt
      - a11y.log
