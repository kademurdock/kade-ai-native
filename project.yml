name: KadeAI
# July 24 2026 — the project's FIRST Swift Package dependency: LiveKit's
# client SDK for the pure-native Clubhouse (pinned exactly; bump on purpose,
# never by accident — no local compiler exists to catch a surprise API break).
# July 28 2026: 2.15.2 -> 2.15.3 on purpose (upstream patch fixes: connection
# state stuck at .connected after a failed reconnect + a teardown crash on
# disconnect mid-ICE-restart -- both sit on the Clubhouse join/leave lane; see
# CLUBHOUSE_NATIVE_AUDIO_SPIKE_2026-07-28.md). Same API surface; the
# second-custom-audio-track publish limit it does NOT fix (still blocked upstream).
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    exactVersion: 2.15.3
options:
  bundleIdPrefix: com.kademurdock
  deploymentTarget:
    iOS: "17.0"
targets:
  KadeAI:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - package: LiveKit
      # July 28 2026 (un-parked by Kade): the Kade Keys keyboard extension
      # rides embedded in the app. XcodeGen embeds app-extension targets
      # into the app's PlugIns automatically from this dependency.
      - target: KadeKeyboard
      # SHARE TO YOUR AGENT — PARKED, ATTEMPT THREE, and the state of the
      # App ID is now KNOWN rather than assumed. Part 121.1: she assigned the
      # group and saved, and the build failed DIFFERENTLY —
      #   "doesn't include the App Groups capability"
      # where before it was "doesn't support the group". The API confirmed it:
      # the capability was GONE from com.kademurdock.kadeai.share entirely.
      # Saving the App ID with the App Groups box unticked REMOVED the
      # capability the API had added, so the save undid the half that worked
      # and never added the half that was missing.
      #
      # The capability has been re-added by API and the stale profiles
      # deleted, so the box should already read as ticked when the page opens.
      # What remains is the ONE thing no API can do:
      #   developer.apple.com/account → Identifiers → App IDs →
      #   com.kademurdock.kadeai.share → App Groups: press EDIT beside it,
      #   tick group.com.kademurdock.kadeai, Continue — and only THEN Save.
      # Saving before the group is chosen is what has now failed twice.
      #
      # (Old note kept below for the API findings, which still stand.)
      # SHARE TO YOUR AGENT — STILL PARKED, and Part 121 finally has the
      # ARCHIVE'S OWN WORDS instead of a guess:
      #
      #   Provisioning profile "com kademurdock kadeai share ios_app_store …"
      #   doesn't support the group.com.kademurdock.kadeai App Group.
      #   …doesn't match the entitlements file's value for the
      #   com.apple.security.application-groups entitlement.
      #
      # The App ID com.kademurdock.kadeai.share HAS the App Groups capability
      # (enabled by API, Part 120) but the GROUP ITSELF is not assigned to it.
      # That assignment is portal-only: Apple's public API exposes no
      # appGroups relationship at all — three separate paths return 400, 403
      # and 404, and the WORKING keyboard capability reads `settings: null`
      # exactly like this one, so the API cannot even show the difference.
      #
      # ⭐ TO FINISH IT — a minute, in a browser, on HER Apple ID:
      #   developer.apple.com/account → Identifiers → App IDs →
      #   com.kademurdock.kadeai.share → App Groups row: tick the CHECKBOX,
      #   then press the EDIT button beside it, tick
      #   group.com.kademurdock.kadeai in the list, Continue, then SAVE the
      #   App ID. Ticking the capability without choosing the group in Edit
      #   is what leaves it in exactly this state.
      # Then uncomment this line and the KadeShare target below, plus the
      # fetch-signing-files line in codemagic.yaml, and build. The old
      # profile is deleted automatically when the capability changes; if a
      # stale one lingers, delete it and rerun.
      #
      # Commented, not deleted: an unsignable target fails EVERY build, not
      # just this feature's. Full tree: branch `share-extension-parked`.
      - target: KadeShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kademurdock.kadeai
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: 100
        DEVELOPMENT_TEAM: JQPWZ2RL9P
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # PART 91.4 — the last accessibility-audit finding, and it was a real
        # one for SIGHTED users. There was no AccentColor asset at all, so
        # everything tinted fell back to iOS system blue (#007AFF): white text
        # on it measures 4.02:1, under the 4.5:1 that normal-size text needs.
        # Apple's audit flagged the Sign in button for exactly that, three runs
        # in a row. Naming the asset here is what makes the catalog entry the
        # app's actual accent.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Manual
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Kade-AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # KADE KEYS dictate (July 31 2026): the keyboard bounces here to
        # record (iOS forbids keyboard microphones, the Wispr dance).
        CFBundleURLTypes:
          - CFBundleURLName: com.kademurdock.kadeai
            CFBundleURLSchemes: [kadeai]
        # Phase 5 (voice mode): push-to-talk records via AVAudioRecorder.
        # iOS hard-crashes on first mic access attempt without this key --
        # no on-device speech recognition is used (no NSSpeechRecognitionUsageDescription
        # needed), audio is just captured and uploaded to the fork's existing
        # /api/files/speech/stt endpoint (Deepgram), same as the web app.
        NSMicrophoneUsageDescription: "Kade-AI uses your microphone so you can talk to your companions with your voice instead of typing."
        # Session 13 ("calling and spotters"): Spotter/Live mode shares your
        # camera during a call so your Spotter can see and describe what's
        # around you -- same crash-without-this-key rule as the mic string
        # above. Only requested the moment you actually tap "Bring in your
        # Spotter" (CameraCaptureController.start()), never on a plain voice call.
        NSCameraUsageDescription: "Kade-AI uses your camera so your Spotter can see what's around you and describe it during a call."
        NSLocationWhenInUseUsageDescription: "Kade-AI uses your location, only while the app is open and only when you turn on Share my location, so your companions can tell you where you are, what's nearby, and how to walk there."
        # Session 14 (lock-screen call controls). Two things need this:
        # a call must keep its audio engine running when the screen locks or
        # the app goes to the background -- otherwise hanging up from the
        # lock screen is moot because the call has already died -- and the
        # Now Playing item that carries those controls is only honoured for
        # an app that actually declares background audio. Scoped to `audio`
        # only; no location, no VoIP (this is deliberately NOT CallKit, see
        # StreamingCallService.startNowPlaying's doc comment).
        UIBackgroundModes: [audio]
        # Session 16 -- Home Screen Quick Actions (long-press/3D-Touch the
        # app icon). Declared STATICALLY here rather than set at runtime
        # via `UIApplication.shared.shortcutItems`: a static entry is
        # already there the moment the app is installed, before it has
        # ever been launched once -- a dynamic one wouldn't exist until
        # `didFinishLaunchingWithOptions` had run at least once to set it.
        # Same three destinations as the Siri Shortcuts (KadeAppIntents.swift),
        # same SF Symbols, routed through the exact same `IntentRouter` --
        # two discovery paths into ONE piece of plumbing, not two features
        # to maintain. See AppDelegate.swift for the handling half.
        # Session 17 (Kade: "a native way to access settings like speech
        # and whatnot. Accessability low vision stuff like that.") -- the
        # two easy-read font choices in Settings > Accessibility need
        # their font files actually registered with the system before
        # `Font.custom(...)` can find them by name. Both fonts are SIL
        # Open Font License 1.1 (Lexend: Google Fonts; OpenDyslexic:
        # antijingoist/opendyslexic) -- license text bundled alongside
        # them in Sources/Fonts/ for attribution. PostScript names (what
        # `Font.custom` actually looks up), confirmed via fontTools:
        # "Lexend-Regular", "OpenDyslexic-Regular", "OpenDyslexic-Bold".
        UIAppFonts:
          - Fonts/Lexend.ttf
          - Fonts/OpenDyslexic-Regular.otf
          - Fonts/OpenDyslexic-Bold.otf
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.kademurdock.kadeai.callSpotter
            UIApplicationShortcutItemTitle: Call your Spotter
            UIApplicationShortcutItemSubtitle: Live visual companion
            UIApplicationShortcutItemIconSymbolName: eye
          - UIApplicationShortcutItemType: com.kademurdock.kadeai.transcribe
            UIApplicationShortcutItemTitle: Transcribe
            UIApplicationShortcutItemSubtitle: Record or import audio
            UIApplicationShortcutItemIconSymbolName: waveform
          - UIApplicationShortcutItemType: com.kademurdock.kadeai.conversations
            UIApplicationShortcutItemTitle: Your conversations
            UIApplicationShortcutItemIconSymbolName: bubble.left.and.bubble.right
          - UIApplicationShortcutItemType: com.kademurdock.kadeai.describe
            UIApplicationShortcutItemTitle: Describe
            UIApplicationShortcutItemSubtitle: Photo or document
            UIApplicationShortcutItemIconSymbolName: plus.viewfinder
          - UIApplicationShortcutItemType: com.kademurdock.kadeai.quickDictate
            UIApplicationShortcutItemTitle: Quick Dictate
            UIApplicationShortcutItemSubtitle: Copies to clipboard
            UIApplicationShortcutItemIconSymbolName: mic.badge.plus
    entitlements:
      path: KadeAI.entitlements
      properties:
        aps-environment: production
        # KADE KEYS phase 2, PARKED ON ONE PORTAL STEP (July 28 2026):
        # the shared-container entitlement is written and ready below, but
        # Apple's official ASC API REFUSES App Group assignment (live 409
        # receipt, session 34: "'APP_GROUP_IDS' is not a valid value for
        # the attribute 'settings/0/key'" -- only fastlane's cookie-auth
        # private API can do it). Until group.com.kademurdock.kadeai is
        # registered BY HAND (developer portal > Identifiers > App Groups)
        # and assigned to BOTH App IDs, signing this entitlement fails --
        # so it stays commented. TO COMPLETE PHASE 2: do the portal step,
        # then uncomment here AND on the KadeKeyboard target AND flip
        # RequestsOpenAccess to true below. The Swift halves already ship
        # dormant and fail soft. See docs/APP_GROUP_STEP_PARKED.md.
        com.apple.security.application-groups:
          - group.com.kademurdock.kadeai
  # KADE KEYS (July 28 2026) — typing-only custom keyboard, v1 = prove the
  # second-target signing pipeline (new bundle id + its own provisioning
  # profile via the same fetch-signing-files flow; see codemagic.yaml).
  # No mic (OS-level block in keyboard extensions), no network
  # (RequestsOpenAccess stays false), no App Group yet (phase 2).
  KadeKeyboard:
    type: app-extension
    platform: iOS
    sources: [KeyboardExtension]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kademurdock.kadeai.keyboard
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: 100
        DEVELOPMENT_TEAM: JQPWZ2RL9P
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Manual
    entitlements:
      path: KadeKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kademurdock.kadeai
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Kade Keys
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            # Phase 2 note (July 28 2026): reading the shared container
            # needs open access (OS rule -- same switch as network) AND
            # the App Group entitlement, which is PARKED on the manual
            # portal step (see the KadeAI target's comment). Flip this to
            # true in the same commit that uncomments the entitlements.
            RequestsOpenAccess: true

  # SHARE EXTENSION (Part 120, Sep 3 2026) — "Send to Kade-AI" in any app's
  # share sheet. It writes the item into the App Group and the APP does the
  # sending; see KadeShareStore.swift for why the extension deliberately holds
  # no session of its own. The App Group entitlement is the same one the
  # keyboard already uses and which is already registered on the portal, so
  # this target needs no new capability — only its own bundle id and profile
  # (codemagic.yaml fetches one the same way it does for the keyboard).
  KadeShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      # The store is ONE file shared by both processes on purpose: the
      # container path, the key, the JSON shape and the staleness rule are
      # the whole contract between them, and a second copy is how two
      # processes start disagreeing about where the file went.
      - path: Sources/KadeShareStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kademurdock.kadeai.share
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: 100
        DEVELOPMENT_TEAM: JQPWZ2RL9P
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Manual
    entitlements:
      path: KadeShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.kademurdock.kadeai
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Send to Kade-AI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
              NSExtensionActivationSupportsText: true

  # GAP 3 (Aug 2026) — Apple's performAccessibilityAudit, run in CI on the
  # Codemagic Mac. Simulator only, never signed, never published; see
  # UITests/KadeA11yAuditUITests.swift for what it walks and why it reports
  # instead of failing. NOT in the KadeAI scheme: the TestFlight lane must not
  # be able to notice this target exists.
  KadeAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: KadeAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kademurdock.kadeai.uitests
        DEVELOPMENT_TEAM: JQPWZ2RL9P
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"
        TEST_TARGET_NAME: KadeAI
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGN_STYLE: Manual

schemes:
  KadeAI:
    build:
      targets:
        KadeAI: all
    archive:
      config: Release
  # Built only by the ios-a11y-audit workflow. The TestFlight lane never names
  # this scheme, so nothing here can lengthen or endanger a release build.
  KadeAIA11yAudit:
    build:
      targets:
        KadeAI: [testing]
        KadeAIUITests: [testing]
    test:
      config: Debug
      targets:
        - KadeAIUITests
